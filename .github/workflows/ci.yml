# Tests Freightdock, then builds its image and publishes it to the GitHub Container Registry.
#
#   pull request      gitleaks, tests and a build of every platform; nothing is published
#   push to main      ghcr.io/<owner>/freightdock:edge
#   tag vX.Y.Z        :X.Y.Z, :X.Y, :X (not for 0.x) and :latest, plus a release with that version's patch notes
#                     (a vX.Y.Z-rc.N tag: :X.Y.Z-rc.N alone, and the release a pre-release)
#
# amd64 and arm64 are each built on a runner of their own architecture (no emulation: compiling Rust under QEMU takes
# the better part of an hour), pushed by digest, and joined into one multi-platform tag. Publishing needs nothing but
# the job's own GITHUB_TOKEN. Two secrets are optional: PRIVATE_PATTERNS (the secrets job), and GIT_DEPS_TOKEN, a
# read-only token for git dependencies that are private on GitHub.
#
# Every action is pinned to a commit, with its version beside it; Dependabot (.github/dependabot.yml) moves the pins.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # gitleaks' image, pinned; the hook (.githooks/pre-commit) uses the same one.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0

jobs:
  # Secrets and private data (.gitleaks.toml): the whole tree, then every commit this push or pull request brings. The
  # tree is copied into gitleaks' container rather than mounted: where the runner's Docker is another machine (a
  # sidecar), a bind mount would be that machine's folder.
  secrets:
    name: Secrets and private data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks on the tree, and on the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          leaks() {
            id=$(docker create "$GITLEAKS_IMAGE" "$@" -c /repo/.gitleaks.toml --no-banner --redact)
            docker cp . "$id:/repo"
            if docker start -a "$id"; then s=0; else s=$?; fi
            docker rm -f "$id" >/dev/null
            return $s
          }
          leaks dir /repo
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..$AFTER"
          else echo "a new branch: the tree was scanned above"; exit 0; fi
          leaks git /repo --log-opts="$range"
      # Names that must not appear but cannot be written in a public file: one extended regular expression a line in
      # the repository secret PRIVATE_PATTERNS (as .git/info/private-patterns is for the hook). Skipped without it.
      - name: Private names
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          [ -n "$PRIVATE_PATTERNS" ] || { echo "PRIVATE_PATTERNS is not set: skipped"; exit 0; }
          printf '%s\n' "$PRIVATE_PATTERNS" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/patterns"
          if git grep -nIiE -f "$RUNNER_TEMP/patterns" -- . ':!web/assets/vendor' ':!web/assets/finui' ':!Cargo.lock' > "$RUNNER_TEMP/hits"; then
            echo "private names found in these files (lines not shown, so the log does not repeat them):"
            cut -d: -f1 "$RUNNER_TEMP/hits" | sort -u
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-
      - name: Private git dependencies, with GIT_DEPS_TOKEN when it is set
        env:
          GIT_DEPS_TOKEN: ${{ secrets.GIT_DEPS_TOKEN }}
        run: |
          [ -n "$GIT_DEPS_TOKEN" ] || { echo "GIT_DEPS_TOKEN is not set: git dependencies are fetched as public"; exit 0; }
          git config --global url."https://x-access-token:${GIT_DEPS_TOKEN}@github.com/".insteadOf https://github.com/
          echo CARGO_NET_GIT_FETCH_WITH_CLI=true >>"$GITHUB_ENV"
      - name: Unit and API tests
        run: cargo test --locked
      - name: Clippy, warnings as errors
        run: cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The web UI parses, and FinUI's presets are what FinUI makes
        run: qa/js-check.sh --here
      - name: A tag must match the version it releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for $version"; exit 1; }

  plan:
    name: Image names and platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      registry: ${{ steps.plan.outputs.registry }}
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      push: ${{ steps.plan.outputs.push }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - id: plan
        run: |
          set -eu
          registry=ghcr.io
          arm=ubuntu-24.04-arm
          # Registries want lower case.
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="$registry/$repo"
          case "$GITHUB_REF" in
            refs/tags/v*) version=${GITHUB_REF_NAME#v} ;;
            refs/heads/main) version=edge ;;
            *) version="pr-$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)" ;;
          esac
          push=false
          [ "$GITHUB_EVENT_NAME" != pull_request ] && push=true
          platforms='[{"platform":"linux/amd64","pair":"linux-amd64","runner":"ubuntu-24.04"}'
          [ -n "$arm" ] && platforms="$platforms,{\"platform\":\"linux/arm64\",\"pair\":\"linux-arm64\",\"runner\":\"$arm\"}"
          platforms="$platforms]"
          builds=$(jq -cn --argjson p "$platforms" '[
            {image: "freightdock", suffix: "", dockerfile: "Dockerfile", title: "Freightdock",
             description: "A Docker management UI: one binary with its web UI built in."}
          ] | [.[] as $i | $p[] | $i + .] | {include: .}')
          {
            echo "registry=$registry"
            echo "image=$image"
            echo "version=$version"
            echo "push=$push"
            echo "builds=$builds"
          } >>"$GITHUB_OUTPUT"
          echo "$image (version $version, push $push): $builds"

  build:
    name: Build ${{ matrix.image }} ${{ matrix.platform }}
    needs: [secrets, test, plan]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}${{ matrix.suffix }}
      VERSION: ${{ needs.plan.outputs.version }}
      PUSH: ${{ needs.plan.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A builder that pushes by digest
        run: docker buildx create --name freightdock --driver docker-container --bootstrap --use
      - name: Sign in to the registry
        if: needs.plan.outputs.push == 'true'
        env:
          REGISTRY: ${{ needs.plan.outputs.registry }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TITLE: ${{ matrix.title }}
          DESCRIPTION: ${{ matrix.description }}
          GIT_DEPS_TOKEN: ${{ secrets.GIT_DEPS_TOKEN }}
        run: |
          set -eu
          # Handed to the build as a BuildKit secret, never a build argument: it is in no layer and no log.
          secret=
          [ -n "$GIT_DEPS_TOKEN" ] && secret=--secret=id=git_deps_token,env=GIT_DEPS_TOKEN
          docker buildx build --platform "$PLATFORM" -f "$DOCKERFILE" $secret \
            --label "org.opencontainers.image.title=$TITLE" \
            --label "org.opencontainers.image.description=$DESCRIPTION" \
            --label "org.opencontainers.image.url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.licenses=GPL-3.0-only" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=$PUSH" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            .
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json"
      - name: Hand the digest to the next job
        if: needs.plan.outputs.push == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.push == 'true'
        with:
          name: digests-${{ matrix.image }}-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: freightdock
            suffix: ''
            description: 'A Docker management UI: one binary with its web UI built in.'
    env:
      IMAGE: ${{ needs.plan.outputs.image }}${{ matrix.suffix }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: Sign in to the registry
        env:
          REGISTRY: ${{ needs.plan.outputs.registry }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Join the platforms under each tag
        working-directory: ${{ runner.temp }}/digests
        env:
          DESCRIPTION: ${{ matrix.description }}
        run: |
          set -eu
          set --
          case "$GITHUB_REF" in
            refs/tags/v*)
              v=${GITHUB_REF_NAME#v}
              set -- -t "$IMAGE:$v"
              # A pre-release (vX.Y.Z-rc.N) is its own tag alone; a release moves X.Y, X (from 1.0) and latest too.
              case "$v" in
                *-*) ;;
                *)
                  set -- "$@" -t "$IMAGE:${v%.*}"
                  [ "${v%%.*}" != 0 ] && set -- "$@" -t "$IMAGE:${v%%.*}"
                  set -- "$@" -t "$IMAGE:latest"
                  ;;
              esac
              ;;
            refs/heads/main) set -- -t "$IMAGE:edge" ;;
            *) echo "::error::nothing to publish for $GITHUB_REF"; exit 1 ;;
          esac
          docker buildx imagetools create "$@" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Show what was published
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.plan.outputs.version }}"

  release:
    name: Release
    needs: [plan, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish this version's patch notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md >notes.md
          printf '\n---\n\n```sh\ndocker pull %s:%s\n```\n' "$IMAGE" "$version" >>notes.md
          set --
          case "$version" in *-*) set -- --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Freightdock $version" --notes-file notes.md --verify-tag "$@"
          echo "released Freightdock $version"
