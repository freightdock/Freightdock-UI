name: Something is wrong
description: Freightdock does something it should not, or does not do what it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Before you post: take out passwords, tokens (`fdk_...`, `FDJT1-...`), webhook addresses, and your own
        host names and addresses. A security problem goes to the Security tab instead (SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Freightdock version
      description: "`freightdock --version`, or the version on the Patch notes page."
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options: [The Docker image, The binary on the host, Built from source]
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version, and the kind of environment
      placeholder: "Docker 29.0, an agent environment"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: log
    attributes:
      label: Freightdock's log around it
      description: "`docker logs freightdock`, with anything private taken out."
      render: text
