name: An idea
description: Something Freightdock should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The job you are trying to get done, not only the button you imagine.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Portainer, on the command line, or not at all.
  - type: textarea
    id: more
    attributes:
      label: Anything else
