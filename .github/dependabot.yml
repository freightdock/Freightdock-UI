# Moves the commits the workflow's actions are pinned to, the images' base images and the crates, once a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The crates. Minor and patch releases come together in one pull request a week; a major release, which may change
  # what the code has to say, comes on its own.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
