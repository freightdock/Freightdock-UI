[package]
name = "freightdock"
description = "The web UI of a Freightdock cluster."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
hmac = "0.13"
http-body-util = "0.1"
jsonwebtoken = "9"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
libc = "0.2"
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
mime_guess = "2"
r2d2 = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
r2d2_sqlite = { version = "0.31", features = ["bundled"] }
# The same rusqlite r2d2_sqlite brings, with SQLite's online backup API.
rusqlite = { version = "0.37", features = ["backup"] }
rand = "0.9"
rcgen = { version = "0.13", features = ["x509-parser"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tower-service = "0.3"
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "chrono"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
